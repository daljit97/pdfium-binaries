name: Build all

permissions:
  contents: read
  actions: write # to upload artifacts

on:
  workflow_dispatch:
    inputs:
      branch:
        description: PDFium branch
        required: false
        default: main
      version:
        description: PDFium version
        required: false
        default: ""
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      enable_asan:
        description: Build supported ASan variants
        type: boolean
        required: false
        default: false
      enable_tsan:
        description: Build supported TSan variants
        type: boolean
        required: false
        default: false
      release:
        description: Publish GitHub release
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            target_os: linux
            target_cpu: arm64
            sanitizer: none
          - name: Linux x64
            target_os: linux
            target_cpu: x64
            sanitizer: none
          - name: Windows ARM64
            target_os: win
            target_cpu: arm64
            sanitizer: none
          - name: Windows x64
            target_os: win
            target_cpu: x64
            sanitizer: none
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: ${{ matrix.target_os }}
      target_cpu: ${{ matrix.target_cpu }}
      enable_v8: false
      sanitizer: none

  build_asan:
    name: ${{ matrix.name }}
    if: github.event.inputs.enable_asan == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 ASan
            target_os: linux
            target_cpu: arm64
          - name: Linux x64 ASan
            target_os: linux
            target_cpu: x64
          - name: Windows x64 ASan
            target_os: win
            target_cpu: x64
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: false
      target_os: ${{ matrix.target_os }}
      target_cpu: ${{ matrix.target_cpu }}
      enable_v8: false
      sanitizer: asan

  build_tsan:
    name: ${{ matrix.name }}
    if: github.event.inputs.enable_tsan == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 TSan
            target_os: linux
            target_cpu: x64
    uses: ./.github/workflows/build.yml
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: false
      target_os: ${{ matrix.target_os }}
      target_cpu: ${{ matrix.target_cpu }}
      enable_v8: false
      sanitizer: tsan

  publish:
    name: Publish Release
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tagname: ${{ github.event.inputs.branch }}
    if: >-
      ${{
        always() &&
        startsWith(github.event.inputs.branch, 'chromium/') &&
        github.event.inputs.version &&
        github.event.inputs.release == 'true' &&
        needs.build.result == 'success' &&
        (needs.build_asan.result == 'success' || needs.build_asan.result == 'skipped') &&
        (needs.build_tsan.result == 'success' || needs.build_tsan.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    needs:
      - build
      - build_asan
      - build_tsan
    permissions:
      contents: write # to create releases
      id-token: write # to attest build provenance
      attestations: write # to attest build provenance
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Create tarballs
        run: |
          for DIR in pdfium-*; do
            echo "::group::$DIR"
            (cd $DIR; tar czf ../$DIR.tgz *)
            echo "::endgroup::"
          done
      - name: Write release body
        run: echo "This version was built with branch \`$BRANCH\` of PDFium" > RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
      - name: Get changes
        continue-on-error: true
        run: |
          CURRENT_REV=$BRANCH
          PREVIOUS_REV=$(curl --silent "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r ".tag_name")
          git clone -b "$BRANCH" https://pdfium.googlesource.com/pdfium.git
          cat <<END >> RELEASE.md
          ### Changes
          Commits between \`$PREVIOUS_REV\` and \`$CURRENT_REV\`:
          END
          git -C "pdfium" log origin/${PREVIOUS_REV}.. --pretty=format:'* [%s](https://pdfium.googlesource.com/pdfium/+/%H)' >> RELEASE.md
        env:
          BRANCH: ${{ github.event.inputs.branch }}
      - name: Generate artifacts checksums
        id: hash
        run: echo "hashes=$(sha256sum pdfium-*.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: pdfium-*.tgz
      - name: Rename provenance file
        run: mv "${{ steps.provenance.outputs.bundle-path }}" pdfium-attestation.json
      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          immutableCreate: true
          bodyFile: RELEASE.md
          token: ${{ secrets.GITHUB_TOKEN }}
          name: PDFium ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.branch }}
          artifacts: pdfium-*.tgz, pdfium-attestation.json
